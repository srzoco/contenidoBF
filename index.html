<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contenido · CIL</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#001E54">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script>
    // Contenido ahora vive dentro de CIL. Esta dirección vieja (íconos guardados y avisos viejos) lleva a la nueva,
    // con la misma pantalla (lo que va después de #), y quita el guardado viejo de esta dirección.
    try { navigator.serviceWorker && navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { if (/\/contenidoBF\/$/i.test(new URL(r.scope).pathname)) r.unregister(); }); }); } catch (e) { /* nada */ }
    location.replace('../cil/contenido/' + location.hash);
  </script>
</head>
<body style="font-family: system-ui, sans-serif; padding: 24px;">
  <p>Contenido ahora está dentro de CIL. <a href="../cil/contenido/">Abrir Contenido</a></p>
</body>
</html>
